<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Simon Sequence — Pattern Pulse</title>
<style>
:root{color-scheme:dark;--bg:#111827;--panel:#1f2937;--muted:#9ca3af;--text:#f9fafb;--accent:#a78bfa}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#263449,var(--bg) 55%);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:20px}
main{width:min(100%,520px);background:rgba(31,41,55,.94);border:1px solid #374151;border-radius:24px;padding:clamp(18px,5vw,32px);box-shadow:0 24px 80px #0005}
header{text-align:center;margin-bottom:20px}h1{margin:0;font-size:clamp(1.8rem,6vw,2.5rem)}.sub{color:var(--muted);margin:.35rem 0 0}
.stats{display:flex;justify-content:center;gap:12px;margin:18px 0}.stat{background:#111827;border:1px solid #374151;border-radius:12px;padding:8px 16px;text-align:center;min-width:100px}.stat strong{display:block;font-size:1.3rem}.stat span{font-size:.8rem;color:var(--muted)}
.board{width:min(100%,350px);aspect-ratio:1;margin:20px auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pad{border:3px solid #ffffff20;border-radius:22px;cursor:pointer;min-width:0;transition:filter .12s,transform .12s,opacity .12s;touch-action:manipulation;box-shadow:inset 0 -8px #0002}
.pad:focus-visible,button:focus-visible{outline:3px solid white;outline-offset:4px}.pad:active{transform:scale(.97)}.pad.lit{filter:brightness(1.65);box-shadow:0 0 25px currentColor,inset 0 -8px #0002;transform:scale(.98)}
.p0{background:#ef4444;color:#ef4444}.p1{background:#22c55e;color:#22c55e}.p2{background:#3b82f6;color:#3b82f6}.p3{background:#eab308;color:#eab308}
.status{text-align:center;min-height:3em;color:#e5e7eb;margin:12px 0}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}button.action{border:0;border-radius:999px;background:var(--accent);color:#1f1635;font-weight:750;padding:11px 22px;cursor:pointer}button.secondary{background:#374151;color:var(--text)}button:disabled{opacity:.5;cursor:not-allowed}
.help{color:var(--muted);font-size:.9rem;text-align:center;margin:18px 0 0}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
</head>
<body>
<main>
<header><h1>Pattern Pulse</h1><p class="sub">Watch the lights. Repeat the sequence.</p></header>
<div class="stats" aria-label="Game statistics"><div class="stat"><strong id="level">0</strong><span>Level</span></div><div class="stat"><strong id="best">0</strong><span>Best level</span></div></div>
<div class="board" role="group" aria-label="Four sequence buttons">
<button class="pad p0" data-pad="0" aria-label="Red"></button><button class="pad p1" data-pad="1" aria-label="Green"></button><button class="pad p2" data-pad="2" aria-label="Blue"></button><button class="pad p3" data-pad="3" aria-label="Yellow"></button>
</div>
<p id="status" class="status" role="status" aria-live="polite">Press Start to begin a new sequence.</p>
<div class="actions"><button id="start" class="action">Start game</button><button id="reset" class="action secondary">Reset</button></div>
<p class="help">Watch the sequence, then tap the same colors in order. Each level adds one light. Keyboard: 1–4 select red, green, blue, yellow.</p>
</main>
<script>
(() => {
  const pads = [...document.querySelectorAll('.pad')];
  const levelEl = document.querySelector('#level');
  const bestEl = document.querySelector('#best');
  const statusEl = document.querySelector('#status');
  const startBtn = document.querySelector('#start');
  const resetBtn = document.querySelector('#reset');
  const colors = ['Red', 'Green', 'Blue', 'Yellow'];
  let sequence = [], inputIndex = 0, level = 0, playing = false, accepting = false, runId = 0;
  let best = 0;
  try { best = Number(localStorage.getItem('pattern-pulse-best') || 0); } catch (_) {}
  bestEl.textContent = best;

  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
  function setStatus(message) { statusEl.textContent = message; }
  function flash(index, duration = 360) {
    return new Promise(resolve => {
      const pad = pads[index];
      pad.classList.add('lit');
      setTimeout(() => { pad.classList.remove('lit'); resolve(); }, duration);
    });
  }
  async function playSequence(id) {
    accepting = false;
    startBtn.disabled = true;
    setStatus('Watch carefully…');
    await wait(500);
    for (const index of sequence) {
      if (id !== runId || !playing) return;
      await flash(index, 420);
      await wait(170);
    }
    if (id !== runId || !playing) return;
    inputIndex = 0;
    accepting = true;
    startBtn.disabled = false;
    startBtn.textContent = 'Replay sequence';
    setStatus('Your turn — repeat the ' + sequence.length + ' light' + (sequence.length === 1 ? '' : 's') + '.');
  }
  function nextLevel() {
    level++;
    levelEl.textContent = level;
    sequence.push(Math.floor(Math.random() * 4));
    playSequence(runId);
  }
  function finish(message) {
    playing = false;
    accepting = false;
    startBtn.disabled = false;
    startBtn.textContent = 'Play again';
    setStatus(message);
  }
  async function press(index) {
    if (!playing || !accepting) return;
    accepting = false;
    await flash(index, 160);
    if (!playing) return;
    if (sequence[inputIndex] !== index) {
      finish('Not quite! You reached level ' + level + '. Press Play again to try once more.');
      return;
    }
    inputIndex++;
    if (inputIndex === sequence.length) {
      if (level > best) {
        best = level;
        bestEl.textContent = best;
        try { localStorage.setItem('pattern-pulse-best', String(best)); } catch (_) {}
      }
      setStatus('Correct! Level ' + (level + 1) + ' is next…');
      await wait(500);
      if (playing) nextLevel();
    } else {
      accepting = true;
      setStatus(colors[sequence[inputIndex]] + ' is next in the pattern.');
    }
  }
  function startGame() {
    runId++;
    sequence = [];
    inputIndex = 0;
    level = 0;
    playing = true;
    levelEl.textContent = '0';
    startBtn.disabled = true;
    startBtn.textContent = 'Sequence playing…';
    nextLevel();
  }
  function resetGame() {
    runId++;
    playing = false;
    accepting = false;
    sequence = [];
    inputIndex = 0;
    level = 0;
    levelEl.textContent = '0';
    startBtn.disabled = false;
    startBtn.textContent = 'Start game';
    pads.forEach(pad => pad.classList.remove('lit'));
    setStatus('Game reset. Press Start to begin a new sequence.');
  }
  pads.forEach(pad => pad.addEventListener('click', () => press(Number(pad.dataset.pad))));
  document.addEventListener('keydown', event => {
    if (event.repeat || event.altKey || event.ctrlKey || event.metaKey) return;
    const keyMap = {'1':0,'2':1,'3':2,'4':3};
    if (Object.prototype.hasOwnProperty.call(keyMap, event.key)) press(keyMap[event.key]);
  });
  startBtn.addEventListener('click', () => {
    if (!playing) startGame();
    else if (!accepting) return;
    else playSequence(runId);
  });
  resetBtn.addEventListener('click', resetGame);
})();
</script>
</body>
</html>
