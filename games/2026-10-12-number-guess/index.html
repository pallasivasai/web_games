<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Number Guess</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <p class="eyebrow">DAILY WEB GAME</p>
    <h1>Number Guess</h1>
    <p id="instructions"></p>
    <section class="panel">
      <p id="status" role="status">Press Start to begin.</p>
      <div id="play"></div>
      <button id="start" type="button">Start game</button>
    </section>
    <p class="foot">Made with plain HTML, CSS and JavaScript. No libraries required.</p>
  </main>
  <script src="game.js"></script>
</body>
</html>
