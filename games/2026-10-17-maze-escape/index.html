<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10251f">
<title>Maze Escape — Find the Exit</title>
<style>
:root{color-scheme:dark;--bg:#10251f;--panel:#18352c;--floor:#d9e9d8;--wall:#27564a;--accent:#f5c451;--text:#f5fbf6;--muted:#b6ccc0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:20px;display:grid;place-items:center;background:radial-gradient(ellipse at top,#285747,var(--bg) 65%);color:var(--text);font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:min(100%,620px);padding:clamp(18px,4vw,30px);background:rgba(24,53,44,.96);border:1px solid #477263;border-radius:24px;box-shadow:0 24px 70px #0004}
header{text-align:center}h1{font-size:clamp(1.9rem,6vw,2.7rem);line-height:1.1;margin:0}header p{color:var(--muted);margin:.7rem 0 1.1rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0}.stat{background:#10251f;border:1px solid #345e50;border-radius:13px;padding:8px;text-align:center}.stat strong{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums}.stat span{font-size:.78rem;color:var(--muted)}
#maze{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:2px;width:min(100%,440px);margin:18px auto;padding:7px;background:#0c1d18;border:1px solid #426b5b;border-radius:12px;touch-action:manipulation}
.cell{aspect-ratio:1;min-width:0;display:grid;place-items:center;border-radius:2px;font-size:clamp(.55rem,2.5vw,1rem);line-height:1;overflow:hidden}
.wall{background:var(--wall)}.floor{background:var(--floor);color:#153a2c}.start{box-shadow:inset 0 0 0 2px #6c9e74}.exit{background:var(--accent);color:#33240a;font-weight:900}.player{background:#8dd8f2;color:#073a50;box-shadow:0 0 0 2px #fff}
.status{min-height:3em;text-align:center;color:#e6f3e9;margin:14px 0}
.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:9px}.action{border:0;border-radius:999px;padding:10px 17px;background:var(--accent);color:#33240a;font-weight:800;cursor:pointer}.secondary{background:#2a4d40;color:var(--text);border:1px solid #507565}.action:focus-visible,.direction:focus-visible{outline:3px solid white;outline-offset:3px}
.controls{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,46px);gap:7px;justify-content:center;margin:18px auto 4px}.direction{border:1px solid #507565;border-radius:12px;background:#24483b;color:var(--text);font-size:1.25rem;cursor:pointer;touch-action:manipulation}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}
.help{text-align:center;color:var(--muted);font-size:.88rem;margin:16px 0 0}
@media(min-width:600px){.controls{display:none}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main>
<header><h1>Maze Escape</h1><p>Find the golden exit. Every maze is generated with a guaranteed route.</p></header>
<section class="stats" aria-label="Game statistics">
<div class="stat"><strong id="time">1:30</strong><span>Time left</span></div>
<div class="stat"><strong id="steps">0</strong><span>Steps</span></div>
<div class="stat"><strong id="best">—</strong><span>Best time</span></div>
</section>
<div id="maze" role="grid" aria-label="Maze board"></div>
<p id="status" class="status" role="status" aria-live="polite">Press Start maze when you're ready.</p>
<div class="actions">
<button id="start" class="action">Start maze</button>
<button id="restart" class="action secondary">Restart run</button>
<button id="newMaze" class="action secondary">New maze</button>
</div>
<div class="controls" aria-label="Touch movement controls">
<button class="direction up" data-dir="up" aria-label="Move up">↑</button>
<button class="direction left" data-dir="left" aria-label="Move left">←</button>
<button class="direction down" data-dir="down" aria-label="Move down">↓</button>
<button class="direction right" data-dir="right" aria-label="Move right">→</button>
</div>
<p class="help">Move with the arrow keys or W A S D. On phones, use the direction buttons. Reach the 🚪 before the timer runs out. Blue is you; gold is the exit.</p>
</main>
<script>
(() => {
  'use strict';
  const CELL_COUNT = 7;
  const GRID_SIZE = CELL_COUNT * 2 + 1;
  const ROUND_SECONDS = 90;
  const mazeEl = document.querySelector('#maze');
  const timeEl = document.querySelector('#time');
  const stepsEl = document.querySelector('#steps');
  const bestEl = document.querySelector('#best');
  const statusEl = document.querySelector('#status');
  const startBtn = document.querySelector('#start');
  const restartBtn = document.querySelector('#restart');
  const newMazeBtn = document.querySelector('#newMaze');
  const directions = {
    up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1]
  };
  let grid = [];
  let player = { row: 1, col: 1 };
  let steps = 0;
  let timeLeft = ROUND_SECONDS;
  let playing = false;
  let hasStarted = false;
  let timerId = null;
  let bestSeconds = null;

  try {
    const saved = Number(localStorage.getItem('maze-escape-best-seconds'));
    if (Number.isFinite(saved) && saved > 0) bestSeconds = saved;
  } catch (_) {}
  bestEl.textContent = bestSeconds === null ? '—' : formatTime(bestSeconds);

  function formatTime(totalSeconds) {
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;
    return minutes + ':' + String(seconds).padStart(2, '0');
  }

  function generateMaze() {
    grid = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(1));
    const visited = Array.from({ length: CELL_COUNT }, () => Array(CELL_COUNT).fill(false));
    const stack = [{ row: 0, col: 0 }];
    visited[0][0] = true;
    grid[1][1] = 0;

    while (stack.length > 0) {
      const current = stack[stack.length - 1];
      const choices = [
        { row: current.row - 1, col: current.col, dr: -1, dc: 0 },
        { row: current.row + 1, col: current.col, dr: 1, dc: 0 },
        { row: current.row, col: current.col - 1, dr: 0, dc: -1 },
        { row: current.row, col: current.col + 1, dr: 0, dc: 1 }
      ].filter(next =>
        next.row >= 0 && next.row < CELL_COUNT &&
        next.col >= 0 && next.col < CELL_COUNT &&
        !visited[next.row][next.col]
      );

      if (choices.length === 0) {
        stack.pop();
        continue;
      }

      const next = choices[Math.floor(Math.random() * choices.length)];
      const wallRow = 2 * current.row + 1 + next.dr;
      const wallCol = 2 * current.col + 1 + next.dc;
      grid[wallRow][wallCol] = 0;
      grid[2 * next.row + 1][2 * next.col + 1] = 0;
      visited[next.row][next.col] = true;
      stack.push({ row: next.row, col: next.col });
    }
    player = { row: 1, col: 1 };
  }

  function renderMaze() {
    mazeEl.replaceChildren();
    const fragment = document.createDocumentFragment();
    for (let row = 0; row < GRID_SIZE; row++) {
      for (let col = 0; col < GRID_SIZE; col++) {
        const cell = document.createElement('div');
        cell.className = 'cell ' + (grid[row][col] === 1 ? 'wall' : 'floor');
        cell.setAttribute('role', 'gridcell');
        const isStart = row === 1 && col === 1;
        const isExit = row === GRID_SIZE - 2 && col === GRID_SIZE - 2;
        const isPlayer = row === player.row && col === player.col;
        if (isStart) cell.classList.add('start');
        if (isExit) {
          cell.classList.add('exit');
          cell.setAttribute('aria-label', 'Exit');
          cell.textContent = '🚪';
        } else if (isPlayer) {
          cell.classList.add('player');
          cell.setAttribute('aria-label', 'Your position');
          cell.textContent = '●';
        } else if (isStart) {
          cell.setAttribute('aria-label', 'Start');
          cell.textContent = 'S';
        } else {
          cell.setAttribute('aria-label', grid[row][col] === 1 ? 'Wall' : 'Path');
        }
        fragment.appendChild(cell);
      }
    }
    mazeEl.appendChild(fragment);
  }

  function stopTimer() {
    if (timerId !== null) clearInterval(timerId);
    timerId = null;
  }

  function finish(won) {
    playing = false;
    stopTimer();
    startBtn.disabled = false;
    startBtn.textContent = 'Start maze';
    if (won) {
      const elapsed = ROUND_SECONDS - timeLeft;
      if (bestSeconds === null || elapsed < bestSeconds) {
        bestSeconds = elapsed;
        bestEl.textContent = formatTime(bestSeconds);
        try { localStorage.setItem('maze-escape-best-seconds', String(bestSeconds)); } catch (_) {}
      }
      statusEl.textContent = 'You escaped in ' + formatTime(elapsed) + ' with ' + steps + ' steps! Choose New maze to play again.';
    } else {
      statusEl.textContent = 'Time is up! You took ' + steps + ' steps. Restart the run or generate a new maze.';
    }
  }

  function startRun() {
    stopTimer();
    player = { row: 1, col: 1 };
    steps = 0;
    timeLeft = ROUND_SECONDS;
    stepsEl.textContent = '0';
    timeEl.textContent = formatTime(timeLeft);
    playing = true;
    hasStarted = true;
    startBtn.disabled = true;
    statusEl.textContent = 'Go! Find the golden exit.';
    renderMaze();
    timerId = setInterval(() => {
      timeLeft--;
      timeEl.textContent = formatTime(timeLeft);
      if (timeLeft <= 0) finish(false);
    }, 1000);
  }

  function newMaze() {
    stopTimer();
    playing = false;
    hasStarted = false;
    steps = 0;
    timeLeft = ROUND_SECONDS;
    stepsEl.textContent = '0';
    timeEl.textContent = formatTime(timeLeft);
    startBtn.disabled = false;
    startBtn.textContent = 'Start maze';
    generateMaze();
    renderMaze();
    statusEl.textContent = 'New maze ready. Press Start maze when you are ready.';
  }

  function move(direction) {
    if (!playing) return;
    const delta = directions[direction];
    if (!delta) return;
    const nextRow = player.row + delta[0];
    const nextCol = player.col + delta[1];
    if (nextRow < 0 || nextRow >= GRID_SIZE || nextCol < 0 || nextCol >= GRID_SIZE) return;
    if (grid[nextRow][nextCol] === 1) return;

    player = { row: nextRow, col: nextCol };
    steps++;
    stepsEl.textContent = String(steps);
    renderMaze();

    if (player.row === GRID_SIZE - 2 && player.col === GRID_SIZE - 2) {
      finish(true);
    }
  }

  startBtn.addEventListener('click', () => {
    if (!playing) startRun();
  });
  restartBtn.addEventListener('click', () => {
    if (hasStarted) startRun();
    else {
      statusEl.textContent = 'Press Start maze to begin your run.';
    }
  });
  newMazeBtn.addEventListener('click', newMaze);
  document.addEventListener('keydown', event => {
    if (event.altKey || event.ctrlKey || event.metaKey) return;
    const keys = {
      ArrowUp: 'up', w: 'up', W: 'up',
      ArrowDown: 'down', s: 'down', S: 'down',
      ArrowLeft: 'left', a: 'left', A: 'left',
      ArrowRight: 'right', d: 'right', D: 'right'
    };
    const direction = keys[event.key];
    if (direction) {
      event.preventDefault();
      move(direction);
    }
  });
  document.querySelectorAll('[data-dir]').forEach(button => {
    button.addEventListener('click', () => move(button.dataset.dir));
  });

  generateMaze();
  renderMaze();
})();
</script>
</body>
</html>
